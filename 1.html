<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>تست سیستم تشخیص صدا</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:tahoma;

background:#111827;

color:white;

text-align:center;

padding:30px;

}


.container{

max-width:600px;

margin:auto;

background:#1f2937;

padding:25px;

border-radius:20px;

}



button{

width:90%;

padding:15px;

font-size:22px;

border:none;

border-radius:15px;

margin:10px;

cursor:pointer;

}



#start{

background:#16a34a;

color:white;

}



#stop{

background:#dc2626;

color:white;

}



.status{

margin:20px;

font-size:20px;

color:#22c55e;

}



#result{

background:#374151;

min-height:100px;

padding:25px;

border-radius:15px;

font-size:26px;

margin-top:20px;

line-height:2;

}



</style>


</head>



<body>


<div class="container">


<h1>
🎤 تست تشخیص صدا
</h1>



<button id="start">

شروع گوش دادن

</button>



<button id="stop">

توقف

</button>



<div class="status" id="status">

خاموش

</div>



<div id="result">

متن تشخیص داده شده اینجا نمایش داده می‌شود

</div>



</div>



<script src="vosk-test.js"></script>

<script>
    //====================================
// تست میکروفون دائم
// آماده اتصال Vosk
//====================================


const startBtn =
document.getElementById("start");


const stopBtn =
document.getElementById("stop");


const status =
document.getElementById("status");


const result =
document.getElementById("result");



let stream = null;

let recorder = null;

let chunks = [];



//====================================
// شروع میکروفون
//====================================


startBtn.onclick = async()=>{


try{


stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});



recorder =
new MediaRecorder(stream);



recorder.ondataavailable = e=>{


if(e.data.size > 0){

chunks.push(e.data);

}

};



recorder.start(1000);



status.innerHTML =
"🎤 میکروفون فعال است و در حال گوش دادن...";



result.innerHTML =
"منتظر صدای شما هستم...";



// شروع حلقه پردازش

listenLoop();



}

catch(error){


console.log(error);


status.innerHTML =
"❌ دسترسی میکروفون رد شد";


}



};




//====================================
// توقف
//====================================


stopBtn.onclick = ()=>{


if(recorder){

recorder.stop();

}


if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

}


status.innerHTML =
"⛔ متوقف شد";


};




//====================================
// حلقه دریافت صدا
//====================================


function listenLoop(){



setInterval(()=>{



if(chunks.length){


console.log(
"دریافت صدا:",
chunks.length
);


// اینجا در مرحله بعد
// صدا به Vosk ارسال می‌شود



chunks=[];


}



},2000);



}
</script>
</body>

</html>
