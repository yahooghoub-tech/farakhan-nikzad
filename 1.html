<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>تست تبدیل صدا به متن</title>

<style>

body{
font-family:tahoma;
background:#111827;
color:white;
text-align:center;
padding:30px;
}

.box{
max-width:600px;
margin:auto;
background:#1f2937;
padding:25px;
border-radius:20px;
}

button{
padding:15px 30px;
font-size:20px;
border:0;
border-radius:15px;
margin:10px;
cursor:pointer;
}

#start{
background:#16a34a;
color:white;
}

#stop{
background:#dc2626;
color:white;
}

#status{
margin:20px;
font-size:20px;
}

#text{

background:#374151;

padding:25px;

border-radius:15px;

font-size:28px;

min-height:100px;

}

</style>

</head>


<body>


<div class="box">

<h1>🎤 تست تشخیص صدا</h1>


<button id="start">
شروع
</button>


<button id="stop">
توقف
</button>


<div id="status">
خاموش
</div>


<div id="text">
متن اینجا نمایش داده می‌شود
</div>


</div>



<script>


const textBox =
document.getElementById("text");


const status =
document.getElementById("status");


let recognition;


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

status.innerHTML =
"مرورگر پشتیبانی نمی‌کند";

}
else{


recognition =
new SpeechRecognition();


recognition.lang="fa-IR";


recognition.continuous=true;


recognition.interimResults=true;



recognition.onstart=()=>{

status.innerHTML =
"🎤 در حال گوش دادن...";

};



recognition.onresult=(event)=>{


let text="";


for(
let i=event.resultIndex;
i<event.results.length;
i++
){

text +=
event.results[i][0].transcript;

}


textBox.innerHTML=text;


};



recognition.onend=()=>{


if(recognition){

recognition.start();

}


};



}



document
.getElementById("start")
.onclick=()=>{


recognition.start();


};



document
.getElementById("stop")
.onclick=()=>{


recognition.stop();


status.innerHTML=
"متوقف شد";


};



</script>


</body>

</html>
