<body>


<h1>تست Vosk</h1>

<button id="start">
🎤 شروع گوش دادن
</button>


<div id="status">
خاموش
</div>


<script>

const status =
document.getElementById("status");


document
.getElementById("start")
.onclick = async()=>{


try{

const stream =
await navigator.mediaDevices.getUserMedia({
audio:true
});


status.innerHTML =
"✅ میکروفون فعال شد";


}
catch(e){

status.innerHTML =
"❌ اجازه میکروفون داده نشد";

console.log(e);

}


};


</script>
