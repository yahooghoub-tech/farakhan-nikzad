<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کلاس چهارم ۲ - فراخوان خروج</title>


<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Vazirmatn;

background:linear-gradient(135deg,#06121f,#12385b);

color:white;

}



.container{

width:90%;

max-width:900px;

margin:auto;

padding:20px;

}



.header{

background:#ffffff22;

backdrop-filter:blur(15px);

border-radius:25px;

padding:25px;

text-align:center;

margin-bottom:25px;

}


.header h1{

margin:0;

font-size:30px;

}



.status-box{

background:#ffffff22;

padding:20px;

border-radius:20px;

text-align:center;

margin-bottom:25px;

}



.cards{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}




.card{

background:#ffffff22;

backdrop-filter:blur(15px);

border-radius:25px;

padding:20px;

}



.student-name{

font-size:24px;

font-weight:bold;

color:#00ff99;

}



.state{

margin:15px 0;

font-size:18px;

}



button{

border:none;

padding:12px;

border-radius:15px;

font-family:inherit;

cursor:pointer;

margin:5px;

font-size:16px;

}



.receive{

background:#ffd000;

}



.send{

background:#00ff99;

}



.sent{

opacity:.6;

}



@media(max-width:600px){

.cards{

grid-template-columns:1fr;

}

}
/* وضعیت کارت ها */

.card.waiting-card{

border:2px solid #ff4444;

background:rgba(255,0,0,.18);

}



.card.received-card{

border:2px solid #ffd000;

background:rgba(255,208,0,.18);

}



.card.sent-card{

border:2px solid #00ff99;

background:rgba(0,255,150,.18);

opacity:.75;

}


</style>

</head>



<body>


<div class="container">


<div class="header">

<h1>
📢 کلاس چهارم ۲
</h1>

<p>
سیستم فراخوان خروج دانش‌آموزان
</p>

</div>



<div class="status-box">

منتظر فراخوان ناظم ...

</div>



<div id="cards" class="cards">


</div>



</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // =====================================
    // اتصال Supabase
    // =====================================
    
    const supabaseClient = supabase.createClient(
    
    "https://ghnpiijihybuhfetnxjp.supabase.co",
    
    "sb_publishable_SEGca8-w1pAO3_TQgMd-qA_vOvkj6jq"
    
    );
    
    
    // =====================================
    // کلاس فعلی این صفحه
    // =====================================
    
    const currentClass = "چهارم 2";
    
    
    
    // =====================================
    // گرفتن فراخوان‌های ذخیره شده
    // بعد از Refresh
    // =====================================
    
    async function loadCalls(){

console.log(
"صفحه کلاس باز شد - منتظر فراخوان جدید"
);

}
 
    
    
    
    
    // =====================================
    // ساخت کارت دانش آموز
    // =====================================
    
    
    function showStudent(call){
    
    
    
    let box =
    document.getElementById("cards");
    
    
    
    if(!box)
    return;
    
    
    
    // جلوگیری از تکرار
    
    
    if(
    document.getElementById(
    "student-"+call.id
    )
    ){
    
    updateCard(call);
    
    return;
    
    }
    
    
    
    
    let card =
    document.createElement("div");
    
    
    
    card.id =
    "student-"+call.id;
    
    
    
    card.className =
    "card";
    
    
    
    
    card.innerHTML = `
    
    
    <div class="student-name">
    
    ${call.student_name}
    
    </div>
    
    
    
    <div class="state">
    
    وضعیت:
    
    <span id="status-${call.id}">
    
    ${getStatusText(call.status)}
    
    </span>
    
    
    </div>
    
    
    
    <button
    
    onclick="changeStatus(${call.id},'received')"
    
    class="receive"
    
    >
    
    دریافت فراخوان
    
    </button>
    
    
    
    <button
    
    onclick="changeStatus(${call.id},'sent')"
    
    class="send"
    
    >
    
    ارسال دانش‌آموز
    
    </button>
    
    
    `;
    
    
    
    box.appendChild(card);
    
    
    
    updateCard(call);
    
    
    }
    
    
    
    
    
    
    // =====================================
    // متن وضعیت
    // =====================================
    
    
    function getStatusText(status){
    
    
    
    switch(status){
    
    
    case "calling":
    
    return "🔔 در انتظار";
    
    
    case "received":
    
    return "✅ دریافت شد";
    
    
    case "sent":
    
    return "🚶 ارسال شد";
    
    
    default:
    
    return status;
    
    
    }
    
    
    }
    
    
    
    
    
    // =====================================
    // تغییر وضعیت از طرف معلم
    // =====================================
    
    
    async function changeStatus(id,status){
    
    
    
    const {error}=
    
    await supabaseClient
    
    .from("calls")
    
    .update({
    
    status:status
    
    })
    
    .eq(
    "id",
    id
    );
    
    
    
    
    if(error){
    
    console.log(
    "Update Error",
    error
    );
    
    return;
    
    }
    
    
    
    let call={
    
    id:id,
    
    status:status
    
    };
    
    
    updateCard(call);
    
    
    
    }
// =====================================
// تغییر ظاهر کارت بر اساس وضعیت
// =====================================


function updateCard(call){


let card =

document.getElementById(
"student-"+call.id
);



if(!card)
return;




// پاک کردن کلاس های قبلی

card.classList.remove(

"waiting-card",

"received-card",

"sent-card"

);




// وضعیت فراخوان

if(call.status==="calling"){


card.classList.add(
"waiting-card"
);


}




if(call.status==="received"){


card.classList.add(
"received-card"
);


}




if(call.status==="sent"){


card.classList.add(
"sent-card"
);


}





// تغییر متن وضعیت


let statusBox =

document.getElementById(
"status-"+call.id
);



if(statusBox){


statusBox.innerHTML =

getStatusText(call.status);


}






// مدیریت دکمه ها


let buttons =

card.querySelectorAll(
"button"
);



if(call.status==="received"){



if(buttons[0]){


buttons[0].style.display="none";


}


}





if(call.status==="sent"){



if(buttons[0]){


buttons[0].style.display="none";


}



if(buttons[1]){


buttons[1].innerHTML=

"✅ ارسال شد";


buttons[1].disabled=true;


}



}



}





// =====================================
// دریافت لحظه ای فراخوان جدید از ناظم
// INSERT
// =====================================


supabaseClient

.channel("new-class-call")

.on(

"postgres_changes",

{

event:"INSERT",

schema:"public",

table:"calls",

filter:

`class_name=eq.${currentClass}`


},

(payload)=>{


console.log(
"New Student:",
payload.new
);



showStudent(
payload.new
);



// صدای هشدار


playAlert();



}

)

.subscribe();







// =====================================
// دریافت تغییر وضعیت
// =====================================


supabaseClient

.channel("update-class-call")

.on(

"postgres_changes",

{

event:"UPDATE",

schema:"public",

table:"calls",

filter:

`class_name=eq.${currentClass}`


},

(payload)=>{


console.log(
"Update:",
payload.new
);



updateCard(
payload.new
);



}

)

.subscribe();







// =====================================
// صدای هشدار
// =====================================


function playAlert(){


let audio =

new Audio(

"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"

);



audio.play()
.catch(()=>{});


}





// =====================================
// شروع صفحه
// =====================================


loadCalls();



</script>



</body>

</html>
